# Static server for the Wayfinder SPA (nginx-unprivileged, port 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Written at container start from the environment: never cache it.
    location = /env-config.js {
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed build output.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/flights, /bookings/..., /profile) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
